<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMentor AI</title>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Our Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-logo">
            <div class="logo-icon">⚡</div>
            <div class="logo-words">
                <span class="logo-name">CodeMentor</span>
                <span class="logo-tag">AI TUTOR</span>
            </div>
        </div>

        <span class="model-badge">● v1.0</span>

        <div class="header-actions">
            <!-- clear chat button -->
            <button class="hdr-btn" id="clearBtn" title="Clear chat" onclick="clearChat()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6l-1 14H6L5 6"/>
                    <path d="M10 11v6M14 11v6"/>
                </svg>
                Clear
            </button>
        </div>
    </header>

    <div class="messages-area" id="msgArea">
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-icon">⚡</div>
            <h1 class="welcome-h1">Hey, I'm CodeMentor</h1>
            <p class="welcome-sub">
                Your personal AI coding tutor. Ask me anything — from basic syntax to tricky algorithms. Let's write some code! 🚀
            </p>
            </div>
        </div>

    </div>

    <div class="input-area">
        <div class="input-wrap">
            <textarea
                id="msgInput"
                rows="1"
                placeholder="Ask me anything about coding..."
                onkeydown="handleKey(event)"
                oninput="handleTyping(this)"
            ></textarea>

            <button class="send-btn" id="sendBtn" onclick="sendMsg()" disabled title="Send message" aria-label="Send message">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </div>

        <div class="input-footer">
            <span class="hint-text">⏎ send &nbsp;·&nbsp; ⇧⏎ new line</span>
            <span class="char-count" id="charCount">0 / 2000</span>
        </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast">Copied!</div>

    <!-- Our Script -->
    <script src="script.js"></script>

</body>
</html>
